[package]
name = "of-service"
description = "The OpenFan Windows service: hosts the control engine and serves the editor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "openfan-service"
path = "src/main.rs"

[dependencies]
of-core = { workspace = true }
of-engine = { workspace = true }
of-hal = { workspace = true }
of-hal-mock = { workspace = true }
of-ipc = { workspace = true }
of-rpc = { workspace = true }
of-contention = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# The updater. Blocking HTTP to match the service, minisign to verify what it downloads
# before anything is executed, and semver so "newer" is a decision rather than a guess.
ureq = "3.4.2"
minisign-verify = "0.2.5"
# Tauri's signer wraps minisign files in base64; see update::keys.
base64 = "0.22.1"
# Fetching the PawnIO hardware module, which PawnIO itself does not install.
sha2 = "0.10.9"
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
semver = "1.0.28"

[target.'cfg(windows)'.dependencies]
of-hal-pawnio = { workspace = true }
windows-service = "0.8.1"
