[package]
name = "of-core"
description = "OpenFan graph model, node catalogue and evaluator. No I/O, no async, no clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
of-units = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
petgraph = { workspace = true }
ts-rs = { workspace = true, optional = true }

[features]
default = []
# Emit TypeScript for the persisted graph types, so the editor and the backend
# cannot disagree about the document format.
ts = ["dep:ts-rs", "of-units/ts"]

[dev-dependencies]
# Profiles are persisted as JSON; the catalogue round-trip test needs it.
serde_json = { workspace = true }
