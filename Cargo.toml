[workspace]
resolver = "3"
members = [
    "crates/of-units",
    "crates/of-core",
    "crates/of-hal",
    "crates/of-hal-mock",
    "crates/of-hal-pawnio",
    "crates/of-engine",
    "crates/of-config",
    "crates/of-contention",
    "crates/of-ipc",
    "crates/of-rpc",
    "crates/of-service",
    "src-tauri",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
repository = "https://github.com/cinderblock/open-fan"
authors = ["Cameron Tacklind <cameron@tacklind.com>"]

[workspace.dependencies]
of-units = { path = "crates/of-units" }
of-core = { path = "crates/of-core" }
of-hal = { path = "crates/of-hal" }
of-hal-mock = { path = "crates/of-hal-mock" }
of-hal-pawnio = { path = "crates/of-hal-pawnio" }
of-engine = { path = "crates/of-engine" }
of-config = { path = "crates/of-config" }
of-contention = { path = "crates/of-contention" }
of-ipc = { path = "crates/of-ipc" }
of-rpc = { path = "crates/of-rpc" }
of-service = { path = "crates/of-service" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
petgraph = "0.8.3"
parking_lot = "0.12.5"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
ts-rs = "12.0.1"
directories = "6.0.0"
windows = "0.62.2"

# The control loop is safety-critical: optimize it even in dev builds, and never
# let an arithmetic overflow silently produce a nonsense duty cycle.
[profile.dev]
opt-level = 1
overflow-checks = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
overflow-checks = true
debug = "line-tables-only" # keep usable backtraces in local crash reports
panic = "unwind"           # the dying-breath handler must be able to run
lto = "thin"
