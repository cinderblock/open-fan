name: Release

# Releases are built and published by CI only. Nothing is ever published from a
# workstation: CI gives a reproducible build from a clean checkout and an auditable
# record tied to a specific commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without creating a release
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile
      - run: bun run bindings

      - name: Verify the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match tauri.conf.json version $manifest"
            exit 1
          fi

      - name: Run the full check suite
        # A release must not be able to ship code that would fail CI.
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --exclude open-fan

      - name: Build and bundle
        env:
          # Set these repository secrets to enable in-app auto-update (Phase 6).
          # Until then the bundle is produced without an update manifest.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: openfan-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/**/*
