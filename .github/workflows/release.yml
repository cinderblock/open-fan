name: Release

# Releases are built and published by CI only. Nothing is ever published from a
# workstation: CI gives a reproducible build from a clean checkout and an auditable
# record tied to a specific commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the artifacts without creating a release
        type: boolean
        default: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - run: bun install --frozen-lockfile
      - run: bun run bindings

      - name: Verify the tag matches the manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $tag does not match tauri.conf.json version $manifest"
            exit 1
          fi

      - name: Run the full check suite
        # A release must not be able to ship code that would fail CI.
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --exclude open-fan

      - name: Fail early if the release cannot be signed
        # A release that quietly ships unsigned is worse than one that does not ship: the
        # service refuses to install unverified code, so those artifacts would reach users
        # and then silently never update. Better to stop here.
        shell: bash
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set; refusing to build an unsignable release"
            exit 1
          fi

      - name: Build and bundle
        env:
          # The private half of the update signing key. The public half is compiled into
          # the service (`of_service::update::PUBLIC_KEY`) and is not secret — it is the
          # thing users verify *against*.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bun run tauri build

      - name: Sign the installer
        # Signed explicitly rather than through `createUpdaterArtifacts`, because that
        # requires a `plugins.updater` config for a plugin we deliberately do not use —
        # the service does the updating, and verifies with its own compiled-in key.
        #
        # `--app-version` binds the version into the signature's *trusted* comment, which
        # is covered by the signature. The service checks it, which is what stops a
        # tampered feed announcing a new version while serving an older signed installer.
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          shopt -s nullglob
          installers=(target/release/bundle/nsis/*-setup.exe)
          if [ ${#installers[@]} -eq 0 ]; then
            echo "::error::no installer was produced to sign"
            exit 1
          fi
          for installer in "${installers[@]}"; do
            echo "signing $installer as $version"
            bun run tauri signer sign --app-version "$version" "$installer"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: openfan-${{ matrix.os }}
          path: |
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.sig
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Write the update manifest
        # What an installed service fetches to learn a newer version exists. Built from
        # the artifacts that were just signed, so the version, the file and the signature
        # cannot drift apart the way they would if this were maintained by hand.
        #
        # The signature is the one produced with `--app-version`, so it vouches for the
        # version named here. The service checks that, which is what stops a tampered or
        # replayed manifest pairing this version number with an older signed installer.
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"

          installer=$(find artifacts -name '*-setup.exe' | head -1)
          signature="$installer.sig"

          if [ ! -f "$installer" ] || [ ! -f "$signature" ]; then
            echo "::error::expected a signed installer; found '$installer'"
            exit 1
          fi

          node -e '
            const fs = require("fs");
            const [version, installer, signature] = process.argv.slice(1);
            const name = require("path").basename(installer);
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              // The asset URL for *this* tag, not `latest`: a manifest must name the
              // build it was signed against, or a client could fetch a newer file with
              // an older signature.
              url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${version}/${name}`,
              signature: fs.readFileSync(signature, "utf8").trim(),
              notes: `OpenFan ${version}`,
            }, null, 2));
          ' "$version" "$installer" "$signature"

          echo "--- latest.json ---"
          cat latest.json

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # Draft on purpose: GitHub does not serve assets of a draft release, so
          # `releases/latest/download/latest.json` stays 404 until this is published.
          # Nothing updates until a human decides it should.
          draft: true
          generate_release_notes: true
          files: |
            artifacts/**/*
            latest.json
